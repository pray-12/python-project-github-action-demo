name: Calculator CI

env:
  APP_NAME: calculator-api

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the tests
        run: pytest -v

      - name: Login to Docker Hub
        run: |
          echo "Logging in to Docker Hub..."

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

          echo "Docker Hub login completed."
          echo "Logging username is ${{ secrets.DOCKERHUB_USERNAME }}"
          echo "App name is ${{ env.APP_NAME }}"
          echo "Python version is ${{ vars.PYTHON_VERSION }}"

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Deploying ${{ env.APP_NAME }} to ${{ vars.DEPLOY_URL }}"
          [ -n "$DEPLOY_TOKEN" ]