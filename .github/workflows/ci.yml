name: Calculator CI
on: 
  push:
    branches: [main]  
  pull_request:
    branches: [main] 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |                    # FIX 3: a real command; | allows multiple lines
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run the tests
        run: pytest -v