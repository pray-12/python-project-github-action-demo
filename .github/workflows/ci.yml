name: Calculator CI
env:
  APP_NAME: calculator-api
on:
  workflow_dispatch:
    branches: [main]
  # push:
  #   branches: [main]  
  # pull_request:
  #   branches: [main] 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |                    # FIX 3: a real command; | allows multiple lines
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run the tests
        run: pytest -v
      - name: Login to Docker Hub
        run: |
          echo "Logging in to Docker Hub..."
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin
          echo "Docker Hub login completed. logging username is ${{ secrets.DOCKERHUB_USERNAME }}. app name is ${{ env.APP_NAME }} and py version is $${{ vars.PYTHON_VERSION }}"

  deploy-staging:
    needs: test
    environment: stage
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Deploying $APP_NAME to ${{ vars.DEPLOY_URL }}"
          [ -n "$DEPLOY_TOKEN" ]